<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strudel Composer</title>
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Strudel Composer</h1>
    <span id="status" class="muted"></span>
  </header>
  <main>
    <section id="terminal-panel" aria-label="Claude Code terminal">
      <div class="toolbar">
        <span class="dot" id="conn" title="terminal connection"></span>
        <strong>Claude Code</strong>
        <span class="muted" id="term-hint">Describe the music you want; songs load on the right.</span>
        <button id="restart" title="Kill this terminal and start a fresh Claude Code session">Restart</button>
      </div>
      <div id="terminal"></div>
    </section>
    <section id="editor-panel" aria-label="Strudel editor">
      <div class="toolbar">
        <button id="play" title="Evaluate and play (ctrl+enter in the editor)">▶ Play</button>
        <button id="stop" title="Stop (ctrl+.)">■ Stop</button>
        <button id="score" title="Render and score the code in the editor">Score my edits</button>
        <select id="versions" title="Versions"><option value="">Versions</option></select>
        <span id="badge" class="badge" hidden></span>
      </div>
      <div id="audio-hint" class="audio-hint" hidden>Click anywhere to enable audio, then press Play.</div>
      <div id="editor-wrap">
        <strudel-editor id="editor"><!--
// Songs from Claude appear here and start playing.
// Meanwhile, press Play to hear a tiny loop:
setcps(0.5)
stack(
  s("bd*4, [~ cp]*2, hh*8").bank("RolandTR909").gain(.8),
  n("<0 2 4 3>*4").scale("C2:minor").s("sawtooth").lpf(500)
)
--></strudel-editor>
      </div>
      <details id="analysis" hidden>
        <summary>Analysis</summary>
        <div id="analysis-body"></div>
      </details>
    </section>
  </main>
  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/xterm-fit/lib/addon-fit.js"></script>
  <script type="module" src="/vendor/strudel-repl/index.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
